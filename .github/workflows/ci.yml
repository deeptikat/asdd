name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run API tests
        run: npm test

  build-images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t campusconnect-api:${{ github.sha }} .
      - name: Build web image
        run: docker build -f frontend/Dockerfile -t campusconnect-web:${{ github.sha }} .
